<section class="stats-dashboard">
  <!-- Header -->
  <div class="dashboard-header">
    <span class="live-dot"></span>
    <span class="dashboard-title">Overview</span>
  </div>

  <!-- Cards -->
  <div class="cards-grid">
    <!-- Patients -->
    <div class="stat-card">
      <div class="card-top">
        <div class="card-icon icon-teal">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
        </div>
      </div>
      <div>
        <div class="card-label">Total Doctors</div>
        <div class="card-value">{{ total_patients() }}</div>
      </div>
    </div>

    <!-- Scans -->
    <div class="stat-card">
      <div class="card-top">
        <div class="card-icon icon-blue">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <path d="M21 15l-5-5L5 21" />
          </svg>
        </div>
      </div>
      <div>
        <div class="card-label">Total Patients</div>
        <div class="card-value">{{ total_scans() }}</div>
      </div>
    </div>

    <!-- Pending -->
    <div class="stat-card">
      <div class="card-top">
        <div class="card-icon icon-amber">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
        </div>
      </div>
      <div>
        <div class="card-label">Total Scans</div>
        <div class="card-value">{{ total_scans() }}</div>
      </div>
    </div>
  </div>

  <!-- Disease Distribution -->
  <div class="chart-card">
    <div class="table-header">
      <h3>Disease Distribution</h3>
      <p>Detected diseases from all scans</p>
    </div>

    <div class="chart-container">
      <canvas #diseaseChart></canvas>
    </div>
  </div>
</section>
