<div class="page-wrapper">
  <div class="card">
    <!-- RIGHT PANEL -->
    <div class="right-panel">
      <div class="form-container">
        <div class="form-header">
          <div class="form-header-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" />
              <path
                d="M4 20c0-4 3.6-7 8-7s8 3 8 7"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
              <path
                d="M19 8v6M16 11h6"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <div>
            <h2>New Administrator</h2>
            <p>Fill in the details below to register a new admin account.</p>
          </div>
        </div>

        <form (ngSubmit)="onSubmit()" #createAdminForm="ngForm" novalidate>
          <!-- PERSONAL INFORMATION -->
          <div class="section-label">Personal Information</div>

          <div class="row-two">
            <div class="field-group">
              <label for="firstName">First Name</label>
              <input
                id="firstName"
                type="text"
                name="firstName"
                [(ngModel)]="firstName"
                placeholder="Doha"
                autocomplete="given-name"
                required
              />
            </div>
            <div class="field-group">
              <label for="lastName">Last Name</label>
              <input
                id="lastName"
                type="text"
                name="lastName"
                [(ngModel)]="lastName"
                placeholder="Afaneh"
                autocomplete="family-name"
                required
              />
            </div>
          </div>

          <div class="field-group">
            <label for="email">Work Email</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                  <rect
                    x="2"
                    y="4"
                    width="20"
                    height="16"
                    rx="2"
                    stroke="#9ca3af"
                    stroke-width="1.8"
                  />
                  <path
                    d="M2 8l10 6 10-6"
                    stroke="#9ca3af"
                    stroke-width="1.8"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
              <input
                id="email"
                type="email"
                name="email"
                [(ngModel)]="email"
                placeholder="admin&#64;hospital.org"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <div class="field-group">
            <label for="username">Username</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                  <circle cx="12" cy="8" r="4" stroke="#9ca3af" stroke-width="1.8" />
                  <path
                    d="M4 20c0-4 3.6-7 8-7s8 3 8 7"
                    stroke="#9ca3af"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  />
                </svg>
              </span>
              <input
                id="username"
                type="text"
                name="username"
                [(ngModel)]="username"
                placeholder="admin.Doha"
                autocomplete="username"
                required
              />
            </div>
          </div>

          <div class="field-group">
            <label for="phone_number">Phone number</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                  <circle cx="12" cy="8" r="4" stroke="#9ca3af" stroke-width="1.8" />
                  <path
                    d="M4 20c0-4 3.6-7 8-7s8 3 8 7"
                    stroke="#9ca3af"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  />
                </svg>
              </span>
              <input
                id="phone_number"
                type="text"
                name="phone_number"
                [(ngModel)]="phone_number"
                placeholder="+254 700 000 000"
                autocomplete="tel"
                required
              />
            </div>
          </div>

          <!-- SECURITY -->
          <div class="section-label">Security</div>

          <div class="field-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                  <rect
                    x="5"
                    y="11"
                    width="14"
                    height="10"
                    rx="2"
                    stroke="#9ca3af"
                    stroke-width="1.8"
                  />
                  <path
                    d="M8 11V7a4 4 0 018 0v4"
                    stroke="#9ca3af"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  />
                </svg>
              </span>
              <input
                id="password"
                [type]="showPassword ? 'text' : 'password'"
                name="password"
                [(ngModel)]="password"
                placeholder="••••••••"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="toggle-btn"
                (click)="togglePassword()"
                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
              >
                @if (!showPassword) {
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                    <path
                      d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"
                      stroke="#9ca3af"
                      stroke-width="1.8"
                    />
                    <circle cx="12" cy="12" r="3" stroke="#9ca3af" stroke-width="1.8" />
                  </svg>
                }
                @if (showPassword) {
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                    <path
                      d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19M1 1l22 22"
                      stroke="#9ca3af"
                      stroke-width="1.8"
                      stroke-linecap="round"
                    />
                  </svg>
                }
              </button>
            </div>
            <span class="field-hint">At least 8 characters with numbers and symbols.</span>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-cancel" (click)="onCancel()">Cancel</button>
            <button
              type="submit"
              class="btn-primary"
              [class.loading]="isLoading"
              [disabled]="isLoading || !formValid"
            >
              @if (!isLoading) {
                <svg
                  width="15"
                  height="15"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="8" r="4" />
                  <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
                  <path d="M19 8v6M16 11h6" />
                </svg>
                Create Admin
              }
              @if (isLoading) {
                <span class="spinner-wrap">
                  <span class="spinner"></span>
                  Creating…
                </span>
              }
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
