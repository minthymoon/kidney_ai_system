<div class="card">
  <div class="avatar">
    {{ patient?.full_name?.charAt(0) || 'AA' }}
  </div>

  <div class="info">
    <h3>{{ patient?.full_name || 'Doha' }}</h3>
    <p>ID: {{ patient?.id || '00557' }}</p>

    <div class="meta">
      <span>{{ patient?.age || '21' }} yrs</span>
      <span>{{ patient?.gender || 'female' }}</span>
    </div>

    <p class="phone">{{ patient?.phone_number || '+9627922586' }}</p>
  </div>

  <button class="view-btn">View</button>
</div>
