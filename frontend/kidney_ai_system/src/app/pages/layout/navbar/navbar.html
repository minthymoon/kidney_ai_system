<header class="navbar">
  <div class="nav-container">
    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon-wrap">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24">
          <path
            d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2Z"
            stroke="currentColor"
            stroke-width="2"
          />
          <path
            d="M12 8v8M8 12h8"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
          />
        </svg>
      </div>
      <span class="logo-text">Kidney <span class="logo-accent">AI</span> System</span>
    </div>

    <!-- Desktop Nav Links -->
    <nav class="nav-links">
      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        Doctor Dashboard
      </a>
      <a routerLink="/patients" routerLinkActive="active">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        Patients
      </a>
      <a routerLink="/scans" routerLinkActive="active">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        Scans
      </a>
    </nav>

    <!-- Right Side -->
    <div class="nav-right">
      <div class="user-menu" (click)="toggleDropdown()">
        <div class="user-avatar-wrap"></div>
        <div class="user-info">
          <span class="user-name">{{ userName() }}</span>
        </div>
        <svg
          class="chevron"
          [ngClass]="{ open: isDropdownOpen }"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <polyline points="6 9 12 15 18 9" />
        </svg>

        <!-- Dropdown Menu -->
        <div
          class="dropdown"
          [ngClass]="{ visible: isDropdownOpen }"
          (click)="$event.stopPropagation()"
        >
          <div class="dropdown-header">
            <div>
              <p class="dh-name">{{ userName() }}</p>
              <p class="dh-email">{{ userEmail() }}</p>
            </div>
          </div>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item" (click)="onProfile()">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            Profile
          </button>
          <button class="dropdown-item logout" (click)="onLogout()">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            Logout
          </button>
        </div>
      </div>

      <!-- Mobile Hamburger -->
      <button class="hamburger" (click)="toggleMobileMenu()" aria-label="Toggle menu">
        <span [ngClass]="{ open: isMobileMenuOpen }"></span>
        <span [ngClass]="{ open: isMobileMenuOpen }"></span>
        <span [ngClass]="{ open: isMobileMenuOpen }"></span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [ngClass]="{ open: isMobileMenuOpen }">
    <a
      routerLink="/home"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="isMobileMenuOpen = false"
    >
      <svg
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        <polyline points="9 22 9 12 15 12 15 22" />
      </svg>
      Doctor Dashboard
    </a>
    <a routerLink="/patients" routerLinkActive="active" (click)="isMobileMenuOpen = false">
      <svg
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
      </svg>
      Patients
    </a>
    <a routerLink="/scans" routerLinkActive="active" (click)="isMobileMenuOpen = false">
      <svg
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
      </svg>
      Scans
    </a>
  </div>
</header>
