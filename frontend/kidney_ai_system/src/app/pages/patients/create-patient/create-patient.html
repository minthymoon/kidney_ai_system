<section class="add-patient-page">
  <div class="container">
    <!-- Page Header -->
    <div class="page-header">
      <div class="page-header-left">
        <button (click)="goToPatients()" class="back-btn" type="button" routerLink="/patients">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24">
            <path
              d="M19 12H5M5 12l7 7M5 12l7-7"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <div>
          <h2>Add New Patient</h2>
          <p>Fill in the details below to register a new patient record</p>
        </div>
      </div>
    </div>

    <!-- Form -->
    <form [formGroup]="patientForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-layout">
        <!-- Left column -->
        <div class="form-col">
          <!-- Basic Information -->
          <div class="card">
            <div class="card-title">
              <div class="card-icon">
                <svg width="15" height="15" fill="none" viewBox="0 0 24 24">
                  <path
                    d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12Zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8Z"
                    fill="currentColor"
                  />
                </svg>
              </div>
              Basic Information
            </div>

            <div class="form-grid two-col">
              <div class="field">
                <label>First Name <span class="req">*</span></label>
                <input
                  formControlName="firstName"
                  type="text"
                  placeholder="e.g. John"
                  [class.error]="isInvalid('firstName')"
                />
                <span class="err-msg" *ngIf="isInvalid('firstName')">First name is required</span>
              </div>

              <div class="field">
                <label>Last Name <span class="req">*</span></label>
                <input
                  formControlName="lastName"
                  type="text"
                  placeholder="e.g. Doe"
                  [class.error]="isInvalid('lastName')"
                />
                <span class="err-msg" *ngIf="isInvalid('lastName')">Last name is required</span>
              </div>

              <div class="field">
                <label>Date of Birth <span class="req">*</span></label>
                <input
                  formControlName="dateOfBirth"
                  type="date"
                  [class.error]="isInvalid('dateOfBirth')"
                />
                <span class="err-msg" *ngIf="isInvalid('dateOfBirth')"
                  >Date of birth is required</span
                >
              </div>

              <div class="field">
                <label>Gender <span class="req">*</span></label>
                <div class="select-wrap">
                  <select formControlName="gender" [class.error]="isInvalid('gender')">
                    <option value="" disabled>Select gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                  </select>
                  <svg class="select-arrow" width="14" height="14" fill="none" viewBox="0 0 24 24">
                    <path
                      d="m6 9 6 6 6-6"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </div>
                <span class="err-msg" *ngIf="isInvalid('gender')">Please select a gender</span>
              </div>
            </div>
          </div>

          <div class="form-col">
            <!-- Medical Identifiers -->
            <div class="card">
              <div class="card-title">
                <div class="card-icon">
                  <svg width="15" height="15" fill="none" viewBox="0 0 24 24">
                    <rect
                      x="5"
                      y="2"
                      width="14"
                      height="20"
                      rx="2"
                      stroke="currentColor"
                      stroke-width="2"
                    />
                    <path
                      d="M9 7h6M9 11h6M9 15h4"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                    />
                  </svg>
                </div>
                Medical Identifiers
              </div>

              <div class="form-grid">
                <div class="field">
                  <label>Referring Physician <span class="optional-lbl">Optional</span></label>
                  <div class="input-icon-wrap">
                    <input
                      formControlName="referringPhysician"
                      type="text"
                      placeholder="Dr. Smith"
                    />
                    <svg class="field-icon" width="14" height="14" fill="none" viewBox="0 0 24 24">
                      <path
                        d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12Zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8Z"
                        fill="currentColor"
                      />
                    </svg>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Contact Details -->
          <div class="card">
            <div class="card-title">
              <div class="card-icon">
                <svg width="15" height="15" fill="none" viewBox="0 0 24 24">
                  <path
                    d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.62 3.39 2 2 0 0 1 3.6 1.21h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.79a16 16 0 0 0 6.29 6.29l.95-.95a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92Z"
                    stroke="currentColor"
                    stroke-width="2"
                  />
                </svg>
              </div>
              Contact Details
              <span class="badge-optional">Optional</span>
            </div>

            <div class="form-grid two-col">
              <div class="field">
                <label>Phone Number</label>
                <input formControlName="phone" type="tel" placeholder="(555) 123-4567" />
              </div>

              <div class="field">
                <label>Email Address</label>
                <input
                  formControlName="email"
                  type="email"
                  placeholder="patient@example.com"
                  [class.error]="isInvalid('email')"
                />
                <span class="err-msg" *ngIf="isInvalid('email')">Enter a valid email</span>
              </div>
            </div>

            <div class="form-grid one-col">
              <div class="field">
                <label>Full Address</label>
                <input
                  formControlName="address"
                  type="text"
                  placeholder="123 Medical Way, Suite 100, City, State, ZIP"
                />
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Page footer actions -->
      <div class="form-actions">
        <button type="button" class="btn-cancel" routerLink="/patients">Cancel</button>
        <button type="submit" class="btn-save" [disabled]="loading">
          <ng-container *ngIf="!loading">
            <svg width="15" height="15" fill="none" viewBox="0 0 24 24">
              <path
                d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"
                stroke="currentColor"
                stroke-width="2"
              />
              <path
                d="M17 21v-8H7v8M7 3v5h8"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            Save Patient Record
          </ng-container>
          <ng-container *ngIf="loading">
            <span class="spinner"></span>
            Saving...
          </ng-container>
        </button>
      </div>
    </form>
  </div>
</section>
