version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend/kidney_ai_system
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    depends_on:
      - backend

  admin:
    build:
      context: ./frontend/kidney_ai_system_admin
      dockerfile: Dockerfile
    ports:
      - "4201:4201"
    depends_on:
      - backend